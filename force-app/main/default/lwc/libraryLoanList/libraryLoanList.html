<template>
    <lightning-card title="Loans" icon-name="standard:contract">
        <template lwc:if={error}>
            <div class="slds-var-p-horizontal_medium slds-text-color_error" role="alert">
                {error}
            </div>
        </template>

        <template lwc:if={hasLoans}>
            <div class="slds-var-p-horizontal_small slds-var-p-bottom_small">
                <lightning-datatable
                    key-field="Id"
                    data={loans}
                    columns={columns}
                    hide-checkbox-column
                    column-widths-mode="auto"
                    onrowaction={handleRowAction}>
                </lightning-datatable>
            </div>
        </template>

        <template lwc:if={showEmpty}>
            <div class="slds-var-p-around_medium slds-text-color_weak">
                No loans registered.
            </div>
        </template>
    </lightning-card>
</template>
